<html lang="de">

<link rel="stylesheet" href="/seiten.css">
</head>
<body data-seite="artikel">
{{include:nav.html}}

<main id="inhalt" class="article-page">
  <div class="container section section--tight">
    <div class="article-layout">
      <article class="article">
        <header class="article-head">
          <nav class="breadcrumb" aria-label="Brotkrümel"><a href="{{BEREICH_URL}}">{{BEREICH}}</a><span aria-hidden="true">/</span>{{KATEGORIE_HTML}}</nav>
          <h1>{{ARTIKEL_TITEL}}</h1>
          <p class="lead">{{ARTIKEL_BESCHREIBUNG}}</p>
        </header>
        <div class="prose">
{{ARTIKEL_HTML}}
        </div>
        {{SUPPORT_HTML}}
      </article>
      <aside class="article-side">
        {{ARTIKEL_TOC_HTML}}
        <a class="side-link" href="{{BEREICH_URL}}">{{icon:chevron-left}}Alle Themen</a>
      </aside>
    </div>
    {{VERWANDT_HTML}}
  </div>
</main>

{{include:footer.html}}
</body>
</html>
