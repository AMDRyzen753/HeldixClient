// Heldix-API: Schnittstelle für Heldix-Addons. Bewusst ohne Minecraft-Abhängigkeit,
// damit Addons über Minecraft-Updates hinweg funktionieren.
plugins {
	id 'java-library'
}

group = 'dev.heldixclient'
version = rootProject.heldix_api_version

base {
	archivesName = 'heldix-api'
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
}
