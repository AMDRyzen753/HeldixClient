dependencyResolutionManagement {
	repositories {
		mavenCentral()
		// nur für die Fabric-Variante des Loaders (Fabric Loader und Mixin zum Kompilieren)
		maven { url = "https://maven.fabricmc.net/" }
		// nur für das Server-Plugin „HeldixClient Server“ (Paper-API)
		maven { url = "https://repo.papermc.io/repository/maven-public/" }
	}
}

rootProject.name = 'heldixclient'

// Heldix Loader: der eigene Mod-Loader (Java-Agent)
include 'heldix-loader'
// derselbe Loader als Fabric-Mod: Heldix-Mods wie HeldixClient laufen damit auch in Fabric-Instanzen
include 'heldix-loader-fabric'
// Heldix-API (reines Java, ohne Minecraft)
include 'heldix-api'
// Heldix-Addons: jedes Addon ist ein eigenes Projekt mit eigener Version und kommt über den Addon-Store
// (nicht mehr mit dem Launcher). Veröffentlichen: im Ordner launcher `npm run addon -- <id>`, siehe docs/addons.md.
include 'addons:uhrzeit'
include 'addons:spotify'
include 'addons:itemphysics'
include 'addons:voicechat'
include 'addons:minimap'
include 'addons:emoterad'
// Server-Plugin „HeldixClient Server“ für Paper (eigene Version, Kanal heldixclient:server, docs/server-plugin.md)
include 'heldix-server'
// Automatischer Test im echten Spiel (wird nicht ausgeliefert)
include 'autotest'
// Test-Addons mit Zugriff auf Minecraft für den Autotest (werden nicht ausgeliefert)
include 'test-addons:minecraft'
