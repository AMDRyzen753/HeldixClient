dependencyResolutionManagement {
	repositories {
		mavenCentral()
		// nur für die Fabric-Variante des Loaders (Fabric Loader und Mixin zum Kompilieren)
		maven { url = "https://maven.fabricmc.net/" }
	}
}

rootProject.name = 'heldixclient'

// Heldix Loader: der eigene Mod-Loader (Java-Agent)
include 'heldix-loader'
// derselbe Loader als Fabric-Mod: Heldix-Mods wie HeldixClient laufen damit auch in Fabric-Instanzen
include 'heldix-loader-fabric'
// Heldix-API (reines Java, ohne Minecraft) und Beispiel-Addon
include 'heldix-api'
include 'example-addon'
// Spotify-Addon (Musik im HUD, Steuerung per Taste; wird mit dem Launcher ausgeliefert)
include 'spotify-addon'
// Automatischer Test im echten Spiel (wird nicht ausgeliefert)
include 'autotest'
