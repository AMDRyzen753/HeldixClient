org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft – seit 26.1 unverschleiert, daher keine Mappings und kein Loom nötig
minecraft_version=26.3

# Heldix Loader: eigener Mod-Loader (Java-Agent + ASM), ganz ohne Fabric
heldix_loader_version=2.5.0
asm_version=9.10.1
# Fabric-Variante des Loaders (nur zum Kompilieren, Fabric bringt beides selbst mit)
fabric_loader_version=0.20.1
fabric_mixin_version=0.17.5+mixin.0.8.7

# Server-Plugin „HeldixClient Server“ (mod/heldix-server): Paper-API der Minecraft-Version oben, Build von repo.papermc.io
heldix_server_version=1.0.0
paper_api_build=263-stable

# HeldixClient
mod_version=0.14.2
heldix_api_version=1.0.0
# Brücke zum offiziellen Minecraft Launcher
launcher_bridge_version=1.0.0
maven_group=dev.heldixclient
archives_base_name=heldixclient
