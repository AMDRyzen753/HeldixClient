// Voice Chat: Sprache in der Nähe mit anderen HeldixClient-Spielern, über den Heldix-Dienst (Heldix-API 11, Server-Gruppen ab 1.4.0, Gäste im Browser,
// Moderation und Melden ab Dienst 1.13.0). Opus kommt aus Concentus (reines Java, BSD-Lizenz) und wird mit in die JAR gepackt.
plugins {
	id 'java'
}

version = '1.4.0'

base {
	archivesName = 'heldix-addon-voicechat'
}

configurations {
	bundled
	implementation.extendsFrom bundled
}

dependencies {
	compileOnly project(':heldix-api')
	bundled 'io.github.jaredmdobson:concentus:1.0.2'
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

// Prüfstand (wird nicht ausgeliefert, läuft mit jedem build): Lautstärke-Schutz an Testsignalen, Ringpuffer mit seinen
// Grenzen (10 Minuten, 3 MiB je Sprecher, 32 Sprecher, 48 MiB) und Lautstärke-Verlauf – ohne JUnit, als eigene Main-Klasse.
sourceSets {
	voiceCheck {
		java.srcDir 'src/check/java'
		compileClasspath += sourceSets.main.output + configurations.compileClasspath
		runtimeClasspath += sourceSets.main.output + configurations.compileClasspath
	}
}

tasks.register('checkVoiceChat', JavaExec) {
	group = 'verification'
	description = 'Prüft Lautstärke-Schutz, Ringpuffer und Lautstärke-Verlauf des Voice Chats'
	classpath = sourceSets.voiceCheck.runtimeClasspath
	mainClass = 'dev.heldixclient.addons.voicechat.VoiceChatCheck'
	jvmArgs '-Dstdout.encoding=UTF-8'
}

check {
	dependsOn('checkVoiceChat')
}

processResources {
	def props = [version: project.version]
	inputs.properties props
	filesMatching('heldix.addon.json') {
		expand props
	}
}

jar {
	// Concentus in die JAR (ohne Signaturen und Manifest der Bibliothek)
	from({ configurations.bundled.collect { it.isDirectory() ? it : zipTree(it) } }) {
		exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/MANIFEST.MF', 'META-INF/maven/**', 'module-info.class'
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
