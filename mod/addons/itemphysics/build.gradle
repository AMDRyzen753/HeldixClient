// Item Physics: gedroppte Items fallen, überschlagen sich und liegen dann flach auf dem Boden, statt zu schweben.
// Ursprünglich eine Heldix-Mod von Kxyuzu, hier als Addon: braucht nur die Heldix-API (ab Version 4), kein Minecraft.
plugins {
	id 'java'
}

version = '1.0.0'

base {
	archivesName = 'heldix-addon-itemphysics'
}

dependencies {
	compileOnly project(':heldix-api')
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

processResources {
	def props = [version: project.version]
	inputs.properties props
	filesMatching('heldix.addon.json') {
		expand props
	}
}
