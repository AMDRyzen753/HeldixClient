<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Startfenster vor dem Hauptfenster (main/splash-window.ts): Suche nach Updates, Laden, Installieren -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; font-src 'self'">
  <title>HeldixClient</title>
  <style>
    @font-face { font-family: "Inter"; src: url("fonts/inter-medium.ttf") format("truetype"); font-weight: 100 500; font-display: block; }
    @font-face { font-family: "Inter"; src: url("fonts/inter-semibold.ttf") format("truetype"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Inter"; src: url("fonts/inter-bold.ttf") format("truetype"); font-weight: 700 900; font-display: block; }
    :root {
      color-scheme: dark;
      --bg: #080b12;
      --line: rgba(255, 255, 255, 0.07);
      --surface-2: rgba(255, 255, 255, 0.07);
      --text: #eef2f8;
      --muted: #9ba6b8;
      --accent: #3b82f6;
      --accent-text: #93c5fd;
      --font: "Inter", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 500 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden; }
    /* rahmenloses Fenster: ganz verschiebbar, nur der Knopf nicht */
    body { display: grid; place-content: center; justify-items: center; gap: 14px; border: 1px solid var(--line); -webkit-app-region: drag; }
    .logo { width: 72px; height: 72px; animation: pop 0.9s cubic-bezier(.2,.9,.3,1.2) both; }
    .word { font: 700 17px var(--font); letter-spacing: -0.01em; }
    .word span { color: var(--accent-text); font-weight: 600; }
    .status { min-height: 19px; max-width: 320px; padding: 0 16px; color: var(--muted); font-size: 12.5px; text-align: center; font-variant-numeric: tabular-nums; }
    .bar { width: 200px; height: 4px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
    .bar span { display: block; width: 40%; height: 100%; border-radius: 3px; background: var(--accent); animation: load 1.1s ease-in-out infinite; }
    .bar.determinate span { animation: none; transition: width 0.3s ease; }
    .skip { -webkit-app-region: no-drag; min-height: 24px; padding: 3px 10px; border: 0; border-radius: 8px; background: none; color: var(--muted); font: 500 12px var(--font); cursor: pointer; }
    .skip:hover, .skip:focus-visible { color: var(--text); background: var(--surface-2); outline: none; }
    .skip[hidden] { display: none; }
    @keyframes pop { from { transform: scale(0.8); opacity: 0; } }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .logo { animation: none; } .bar span { animation-duration: 2.4s; } }
  </style>
</head>
<body>
  <img class="logo" src="logo.svg" alt="">
  <div class="word">Heldix <span>Client</span></div>
  <div class="status" id="splash-status" role="status" aria-live="polite">Suche nach Updates …</div>
  <div class="bar" id="splash-bar"><span id="splash-bar-fill"></span></div>
  <button class="skip" id="splash-skip" type="button" hidden>Später – Launcher jetzt öffnen</button>
</body>
</html>
