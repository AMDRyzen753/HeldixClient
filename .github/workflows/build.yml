# Baut Heldix Loader, Client-Mod, Addons, den Windows-Installer und die macOS-App (Apple Silicon und Intel).
# Bei einem Tag wie v0.7.0 werden Installer und Mac-Downloads zusätzlich als GitHub-Release veröffentlicht, und
# update-mac.json (Mac-Updates über den Heldix-Dienst) wird mit dem Geheimnis HELDIX_UPDATE_KEY signiert.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Installer bauen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Java 25 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            mod/**/*.gradle
            mod/gradle.properties
            mod/gradle/wrapper/gradle-wrapper.properties

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      # Gradle lädt Minecraft zum Kompilieren von Mojang; das muss nicht bei jedem Lauf neu passieren
      - name: Minecraft-Dateien zwischenspeichern
        uses: actions/cache@v6
        with:
          path: mod/.gradle/minecraft
          key: minecraft-${{ hashFiles('mod/gradle.properties') }}

      - name: Abhängigkeiten installieren
        working-directory: launcher
        run: npm ci

      - name: Java-Teile, Launcher und Installer bauen
        working-directory: launcher
        run: npm run dist -- --publish never

      # Der Gradle-Daemon hält unter Windows Dateien im Gradle- und Minecraft-Cache offen; dann bricht das Speichern der
      # Caches am Ende ab („tar.exe failed with exit code 2“). Daher vorher beenden.
      - name: Gradle-Daemon beenden
        if: always()
        continue-on-error: true
        working-directory: mod
        run: ./gradlew.bat --stop

      - name: Installer hochladen
        uses: actions/upload-artifact@v7
        with:
          name: HeldixClient-Setup
          path: launcher/release/*.exe
          if-no-files-found: error

  build-mac:
    name: macOS-App bauen
    # aktueller Apple-Silicon-Runner von GitHub (macos-14 gibt es nicht mehr); electron-builder baut dort auch die Intel-Version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Java 25 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            mod/**/*.gradle
            mod/gradle.properties
            mod/gradle/wrapper/gradle-wrapper.properties

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Minecraft-Dateien zwischenspeichern
        uses: actions/cache@v6
        with:
          path: mod/.gradle/minecraft
          key: minecraft-mac-${{ hashFiles('mod/gradle.properties') }}

      - name: Abhängigkeiten installieren
        working-directory: launcher
        run: npm ci

      # ohne Apple-Entwicklerzertifikat: ad-hoc signiert (läuft auf Apple Silicon, Gatekeeper fragt beim ersten Start)
      - name: Java-Teile, Launcher und Mac-App bauen
        working-directory: launcher
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --publish never

      - name: Gradle-Daemon beenden
        if: always()
        continue-on-error: true
        working-directory: mod
        run: sh gradlew --stop

      - name: Mac-Downloads hochladen
        uses: actions/upload-artifact@v7
        with:
          name: HeldixClient-macOS
          path: |
            launcher/release/*.dmg
            launcher/release/*.zip
          if-no-files-found: error

  # Signiert die Mac-Updates (update-mac.json) mit dem Update-Schlüssel – nur bei Versions-Tags und in einem eigenen,
  # kleinen Job: Der Schlüssel liegt als Geheimnis HELDIX_UPDATE_KEY in der Umgebung „release“ (Einstellungen →
  # Environments, am besten mit „Required reviewers“) und ist nur im Schritt „update-mac.json signieren“ sichtbar.
  # Signiert werden genau die ZIPs aus dem Job „build-mac“ – also diese ZIPs hochladen, nicht neu gebaute.
  sign-mac:
    name: Mac-Updates signieren
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-mac
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      # ohne Installationsskripte der Pakete (und ohne Electron-Download) – hier wird nur TypeScript übersetzt
      - name: Abhängigkeiten installieren
        working-directory: launcher
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --ignore-scripts

      - name: Launcher-Skripte übersetzen
        working-directory: launcher
        run: npm run build

      - name: Tag und Version vergleichen
        working-directory: launcher
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $version in launcher/package.json."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: HeldixClient-macOS
          path: launcher/mac-artifacts

      - name: update-mac.json signieren
        working-directory: launcher
        env:
          HELDIX_UPDATE_KEY: ${{ secrets.HELDIX_UPDATE_KEY }}
        run: |
          if [ -z "$HELDIX_UPDATE_KEY" ]; then
            echo "::error::Geheimnis HELDIX_UPDATE_KEY fehlt (Einstellungen → Environments → release, Inhalt von update-key.pem)."
            exit 1
          fi
          node dist/scripts/release-mac.js mac-artifacts

      - name: update-mac.json hochladen
        uses: actions/upload-artifact@v7
        with:
          name: HeldixClient-macOS-Update
          path: launcher/release/update/update-mac*.json
          if-no-files-found: error

  release:
    name: Release veröffentlichen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-mac, sign-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: HeldixClient-Setup
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: HeldixClient-macOS
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: HeldixClient-macOS-Update
          path: release

      - name: GitHub-Release mit Installer und Mac-Downloads anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" release/*.exe release/*.dmg release/*.zip release/update-mac.json
          --repo "${{ github.repository }}"
          --title "HeldixClient ${{ github.ref_name }}"
          --generate-notes
