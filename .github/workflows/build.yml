# Baut Heldix Loader, Client-Mod, Addons und den Windows-Installer.
# Bei einem Tag wie v0.7.0 wird der Installer zusätzlich als GitHub-Release veröffentlicht.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Installer bauen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            mod/**/*.gradle
            mod/gradle.properties
            mod/gradle/wrapper/gradle-wrapper.properties

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      # Gradle lädt Minecraft zum Kompilieren von Mojang; das muss nicht bei jedem Lauf neu passieren
      - name: Minecraft-Dateien zwischenspeichern
        uses: actions/cache@v4
        with:
          path: mod/.gradle/minecraft
          key: minecraft-${{ hashFiles('mod/gradle.properties') }}

      - name: Abhängigkeiten installieren
        working-directory: launcher
        run: npm ci

      - name: Java-Teile, Launcher und Installer bauen
        working-directory: launcher
        run: npm run dist -- --publish never

      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: HeldixClient-Setup
          path: launcher/release/*.exe
          if-no-files-found: error

  release:
    name: Release veröffentlichen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HeldixClient-Setup
          path: release

      - name: GitHub-Release mit Installer anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" release/*.exe
          --repo "${{ github.repository }}"
          --title "HeldixClient ${{ github.ref_name }}"
          --generate-notes
